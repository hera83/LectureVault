services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lecturevault:latest
    container_name: lecturevault
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      # SQLite databases (app.db + logs.db) — must persist across container restarts/rebuilds.
      - lecturevault_dbs:/app/App_dbs
      # Uploaded/generated files (avatars, uploads, exports, temp, lectures).
      - lecturevault_files:/app/App_files

volumes:
  lecturevault_dbs:
  lecturevault_files:
